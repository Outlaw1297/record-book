name: Docker images

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/android/**'
      - '!app/capacitor.config.ts'
      - 'api/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ghcr.io/outlaw1297/record-book-api:latest
          labels: org.opencontainers.image.source=https://github.com/Outlaw1297/record-book

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: |
            VITE_RANCH_API_URL=/api
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_DROPBOX_APP_KEY=${{ secrets.VITE_DROPBOX_APP_KEY }}
          tags: ghcr.io/outlaw1297/record-book-web:latest
          labels: org.opencontainers.image.source=https://github.com/Outlaw1297/record-book

      - name: Make packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in record-book-api record-book-web; do
            gh api --method PUT \
              "/user/packages/container/${pkg}/visibility" \
              -f visibility=public || true
          done
