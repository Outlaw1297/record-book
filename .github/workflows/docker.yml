name: Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ghcr.io/outlaw1297/record-book-api:latest
          labels: org.opencontainers.image.source=https://github.com/Outlaw1297/record-book

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: |
            VITE_RANCH_API_URL=/api
          tags: ghcr.io/outlaw1297/record-book-web:latest
          labels: org.opencontainers.image.source=https://github.com/Outlaw1297/record-book

      - name: Require public packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR is private by default and has no visibility API. Fail until each
          # package is made public once in the GitHub UI so Portainer can pull.
          owner="${GITHUB_REPOSITORY_OWNER}"
          failed=0
          for pkg in record-book-api record-book-web; do
            vis=$(gh api "/user/packages/container/${pkg}" --jq .visibility)
            echo "${pkg}: ${vis}"
            if [ "$vis" != "public" ]; then
              echo "::error::${pkg} is ${vis}. Make it public once at https://github.com/users/${owner}/packages/container/${pkg}/settings (Danger Zone → Change visibility → Public)."
              failed=1
            fi
          done
          exit "${failed}"
