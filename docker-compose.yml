# Record Book stack for Docker Compose and Portainer.
# Portainer: Stacks → Add stack → Repository, compose path docker-compose.yml
# Set POSTGRES_PASSWORD and API_KEY in the stack environment before deploy.

name: record-book

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recordbook}
      POSTGRES_USER: ${POSTGRES_USER:-recordbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    volumes:
      - recordbook_pg:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recordbook} -d ${POSTGRES_DB:-recordbook}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ranch

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: record-book-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-recordbook}:${POSTGRES_PASSWORD:-change-me-now}@postgres:5432/${POSTGRES_DB:-recordbook}
      API_KEY: ${API_KEY:-change-me-api-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 8
    networks:
      - ranch

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_RANCH_API_URL: ${VITE_RANCH_API_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_DROPBOX_APP_KEY: ${VITE_DROPBOX_APP_KEY:-}
    image: record-book-web:local
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - ranch

volumes:
  recordbook_pg:

networks:
  ranch:
    driver: bridge
