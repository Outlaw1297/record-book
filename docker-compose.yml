# Portainer: Git this repo, branch main, compose docker-compose.yml.
# Leave Build OFF. Images are published to ghcr.io on each push to main.

services:
  keys:
    image: busybox:1.37
    restart: unless-stopped
    volumes:
      - keys:/keys
    command:
      - sh
      - -c
      - |
        if [ ! -f /keys/pg_password ]; then
          tr -dc A-Za-z0-9 </dev/urandom | head -c 32 > /keys/pg_password
        fi
        if [ ! -f /keys/api_key ]; then
          tr -dc A-Za-z0-9 </dev/urandom | head -c 32 > /keys/api_key
        fi
        chmod 644 /keys/pg_password /keys/api_key
        echo "Ranch keys ready"
        exec tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "test -s /keys/pg_password && test -s /keys/api_key"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_healthy
    environment:
      POSTGRES_DB: recordbook
      POSTGRES_USER: recordbook
      POSTGRES_PASSWORD_FILE: /keys/pg_password
    volumes:
      - pg:/var/lib/postgresql/data
      - keys:/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recordbook -d recordbook"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/outlaw1297/record-book-api:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - keys:/keys:ro

  web:
    image: ghcr.io/outlaw1297/record-book-web:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - keys:/keys:ro
    # Host 8180 so nginx can keep 80 and 8080. Change 8180 if needed.
    ports:
      - "8180:80"

volumes:
  keys:
  pg:
