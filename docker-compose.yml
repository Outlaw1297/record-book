# Portainer: Stacks → Git → this repo → main → docker-compose.yml → enable Build → Deploy.
# No environment variables. Keys are created on first boot and stored in the keys volume.

services:
  keys:
    image: busybox:1.37
    volumes:
      - keys:/keys
    command:
      - sh
      - -c
      - |
        if [ ! -f /keys/pg_password ]; then
          tr -dc A-Za-z0-9 </dev/urandom | head -c 32 > /keys/pg_password
        fi
        if [ ! -f /keys/api_key ]; then
          tr -dc A-Za-z0-9 </dev/urandom | head -c 32 > /keys/api_key
        fi
        chmod 644 /keys/pg_password /keys/api_key

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: recordbook
      POSTGRES_USER: recordbook
      POSTGRES_PASSWORD_FILE: /keys/pg_password
    volumes:
      - recordbook_pg:/var/lib/postgresql/data
      - keys:/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recordbook -d recordbook"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - keys:/keys:ro

  web:
    build: ./app
    restart: unless-stopped
    depends_on:
      keys:
        condition: service_completed_successfully
      api:
        condition: service_started
    volumes:
      - keys:/keys:ro
    ports:
      - "80:80"

volumes:
  keys:
  recordbook_pg:
